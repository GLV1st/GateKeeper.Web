<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GateKeeper Access</title>


    <!-- GateKeeper styling -->

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/site.css">


    <!-- Login page styling -->

    <style>

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        header {
            width: 100%;
        }


        main {
            flex: 1;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 30px 20px;
        }


        .login-card {

            width: 100%;
            max-width: 520px;

            padding: 40px;

            text-align: center;

            box-sizing: border-box;
        }


        .login-card .icon {

            font-size: 56px;

            margin-bottom: 15px;
        }


        .login-card h2 {

            font-size: 30px;

            margin-bottom: 12px;
        }


        .login-card p {

            font-size: 17px;

            margin-bottom: 30px;
        }


        #password {

            width: 100%;

            height: 64px;

            padding: 0 18px;

            font-size: 22px;

            text-align: center;

            border-radius: 12px;

            box-sizing: border-box;
        }


        .primary-button {

            width: 100%;

            height: 64px;

            margin-top: 18px;

            font-size: 20px;

            border-radius: 12px;

            cursor: pointer;
        }


        .login-message {

            min-height: 25px;

            margin-top: 18px;

            font-size: 16px;
        }


        footer {

            text-align: center;

            padding: 20px;
        }


        @media (max-width: 600px) {

            main {

                padding: 20px 15px;
            }


            .login-card {

                padding: 30px 20px;
            }


            .login-card h2 {

                font-size: 26px;
            }


            #password,
            .primary-button {

                height: 60px;
            }

        }

    </style>

</head>


<body>


    <header>

        <h1>GateKeeper!</h1>

        <div class="status online">
            ● Online
        </div>

    </header>



    <main>

        <section class="login-card">


            <div class="icon">
                🔐
            </div>


            <h2>
                GateKeeper Access
            </h2>


            <p>
                Enter the event access password to continue.
            </p>



            <form id="loginForm">


                <input
                    type="password"
                    id="password"
                    placeholder="Access password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    class="primary-button"
                >
                    Access GateKeeper
                </button>


            </form>



            <div
                id="loginMessage"
                class="login-message"
            ></div>


        </section>

    </main>



    <footer>

        Version 1.0.0

    </footer>



    <!-- GateKeeper authentication -->

    <script src="js/auth.js"></script>



    <script>

        /*
         * If this device is already authenticated,
         * go straight to the GateKeeper home page.
         */

        if (isGateKeeperAuthenticated()) {

            window.location.replace(
                "index.html"
            );

        }



        /*
         * Login form
         */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const password =
                        document
                            .getElementById("password")
                            .value
                            .trim();


                    const message =
                        document
                            .getElementById("loginMessage");


                    if (!password) {

                        message.textContent =
                            "Please enter the access password.";

                        return;

                    }


                    message.textContent =
                        "Checking password...";


                    const result =
                        await loginGateKeeper(
                            password
                        );


                    if (result.success) {

                        message.textContent =
                            "Access granted.";


                        window.location.replace(
                            "index.html"
                        );


                    } else {

                        message.textContent =
                            result.message ||
                            "Incorrect password.";


                        document
                            .getElementById("password")
                            .value = "";


                        document
                            .getElementById("password")
                            .focus();

                    }

                }
            );

    </script>


</body>

</html>
