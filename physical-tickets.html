<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Physical Tickets</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f8;

            color: #1f2937;

        }


        .page {

            max-width: 900px;

            margin: 0 auto;

            padding: 30px 20px 60px;

        }


        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }


        .back-button {

            display: inline-block;

            padding: 10px 16px;

            background: #ffffff;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            color: #374151;

            text-decoration: none;

            font-weight: 600;

        }


        .back-button:hover {

            background: #f9fafb;

        }


        .status {

            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 14px;

            color: #15803d;

            font-weight: 600;

        }


        .status-dot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #22c55e;

        }


        h1 {

            margin: 0 0 8px;

            font-size: 32px;

        }


        .subtitle {

            margin: 0 0 30px;

            color: #6b7280;

            font-size: 16px;

        }


        .panel {

            background: #ffffff;

            border-radius: 12px;

            padding: 30px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.06);

        }


        .form-group {

            margin-bottom: 22px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: 700;

            font-size: 15px;

        }


        select,
        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            background: #ffffff;

            font-size: 16px;

            color: #111827;

        }


        select:focus,
        input:focus {

            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);

        }


        .generate-button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: #ffffff;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

        }


        .generate-button:hover {

            background: #1d4ed8;

        }


        .generate-button:disabled {

            background: #9ca3af;

            cursor: not-allowed;

        }


        .message {

            display: none;

            margin-top: 25px;

            padding: 15px;

            border-radius: 8px;

            font-weight: 600;

        }


        .message.success {

            display: block;

            background: #dcfce7;

            color: #166534;

            border: 1px solid #86efac;

        }


        .message.error {

            display: block;

            background: #fee2e2;

            color: #991b1b;

            border: 1px solid #fca5a5;

        }


        .results {

            display: none;

            margin-top: 25px;

        }


        .results h2 {

            margin: 0 0 15px;

            font-size: 21px;

        }


        .ticket-list {

            max-height: 300px;

            overflow-y: auto;

            background: #f9fafb;

            border: 1px solid #e5e7eb;

            border-radius: 8px;

            padding: 12px;

        }


        .ticket-number {

            display: inline-block;

            background: #ffffff;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            padding: 7px 10px;

            margin: 4px;

            font-family: monospace;

            font-weight: 600;

        }


        .loading {

            color: #6b7280;

            font-style: italic;

        }


        @media (max-width: 600px) {

            .page {

                padding: 20px 15px 40px;

            }


            .panel {

                padding: 20px;

            }


            h1 {

                font-size: 27px;

            }


            .top-bar {

                align-items: flex-start;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <div class="top-bar">

        <a
            href="stats.html"
            class="back-button"
        >
            ← Event Status
        </a>


        <div class="status">

            <span class="status-dot"></span>

            Admin

        </div>

    </div>


    <h1>Create Physical Tickets</h1>

    <p class="subtitle">
        Generate tickets for physical sale or distribution at the event.
    </p>


    <div class="panel">


        <div class="form-group">

            <label for="eventSelect">
                Event
            </label>

            <select id="eventSelect">

                <option value="">
                    Loading events...
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="ticketType">

                Ticket Type

            </label>


            <select id="ticketType">

                <option value="Under 14 Yrs">
                    Under 14 Yrs
                </option>

                <option value="Over 14 Yrs">
                    Over 14 Yrs
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="quantity">

                Quantity

            </label>


            <input
                type="number"
                id="quantity"
                min="1"
                max="10000"
                value="100"
            >

        </div>


        <button
            id="generateButton"
            class="generate-button"
        >
            Generate Physical Tickets
        </button>


        <div
            id="message"
            class="message"
        ></div>


        <div
            id="results"
            class="results"
        >

            <h2>
                Generated Tickets
            </h2>


            <div
                id="ticketList"
                class="ticket-list"
            ></div>

        </div>


    </div>

</div>


<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    initialise
);


async function initialise() {


    // =====================================
    // CHECK ADMIN AUTHENTICATION
    // =====================================

    if (!checkAdminAuth()) {

        return;

    }


    // =====================================
    // LOAD EVENTS
    // =====================================

    await loadEvents();


    // =====================================
    // BUTTON
    // =====================================

    document
        .getElementById("generateButton")
        .addEventListener(
            "click",
            generateTickets
        );

}


async function loadEvents() {


    const select =
        document.getElementById(
            "eventSelect"
        );


    try {


        const events =
            await GateKeeperAPI.getEvents();


        select.innerHTML =
            '<option value="">Select an event...</option>';


        if (
            !events ||
            events.length === 0
        ) {

            select.innerHTML =
                '<option value="">No events found</option>';

            return;

        }


        events.forEach(
            event => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    event.EventId ||
                    event.eventId ||
                    event.Id ||
                    event.id;


                option.textContent =
                    event.Name ||
                    event.name ||
                    "Unnamed Event";


                select.appendChild(
                    option
                );

            }
        );


    }
    catch (error) {


        console.error(
            "Unable to load events:",
            error
        );


        select.innerHTML =
            '<option value="">Unable to load events</option>';

    }

}


async function generateTickets() {


    const eventSelect =
        document.getElementById(
            "eventSelect"
        );


    const ticketType =
        document.getElementById(
            "ticketType"
        ).value;


    const quantity =
        parseInt(
            document.getElementById(
                "quantity"
            ).value,
            10
        );


    const button =
        document.getElementById(
            "generateButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const results =
        document.getElementById(
            "results"
        );


    const ticketList =
        document.getElementById(
            "ticketList"
        );


    // =====================================
    // RESET
    // =====================================

    message.className =
        "message";

    message.textContent =
        "";

    results.style.display =
        "none";

    ticketList.innerHTML =
        "";


    // =====================================
    // VALIDATION
    // =====================================

    if (!eventSelect.value) {

        message.className =
            "message error";

        message.textContent =
            "Please select an event.";

        return;

    }


    if (
        !quantity ||
        quantity < 1
    ) {

        message.className =
            "message error";

        message.textContent =
            "Please enter a valid quantity.";

        return;

    }


    if (quantity > 10000) {

        message.className =
            "message error";

        message.textContent =
            "Maximum quantity is 10,000.";

        return;

    }


    // =====================================
    // CONFIRM
    // =====================================

    const confirmed =
        confirm(
            `Generate ${quantity} physical ${ticketType} tickets?`
        );


    if (!confirmed) {

        return;

    }


    // =====================================
    // GENERATE
    // =====================================

    button.disabled =
        true;

    button.textContent =
        "Generating tickets...";


    try {


        const generated =
            await GateKeeperAPI.generatePhysicalTickets(

                eventSelect.value,

                ticketType,

                quantity

            );


        // =====================================
        // NORMALISE RESPONSE
        // =====================================

        let tickets =
            generated;


        if (
            generated &&
            generated.tickets
        ) {

            tickets =
                generated.tickets;

        }


        if (
            !Array.isArray(tickets)
        ) {

            tickets = [];

        }


        // =====================================
        // SUCCESS
        // =====================================

        message.className =
            "message success";

        message.textContent =
            `${tickets.length || quantity} physical ticket(s) generated successfully.`;


        // =====================================
        // SHOW TICKETS
        // =====================================

        if (
            tickets.length > 0
        ) {


            results.style.display =
                "block";


            tickets.forEach(
                ticket => {


                    const number =
                        ticket.TicketNumber ||
                        ticket.ticketNumber ||
                        ticket.Number ||
                        ticket.number ||
                        ticket.RowKey ||
                        ticket.rowKey ||
                        ticket;


                    const span =
                        document.createElement(
                            "span"
                        );


                    span.className =
                        "ticket-number";


                    span.textContent =
                        number;


                    ticketList.appendChild(
                        span
                    );

                }
            );

        }


    }
    catch (error) {


        console.error(
            error
        );


        message.className =
            "message error";

        message.textContent =
            error.message ||
            "Unable to generate physical tickets.";

    }
    finally {


        button.disabled =
            false;

        button.textContent =
            "Generate Physical Tickets";

    }

}

</script>


</body>

</html>
