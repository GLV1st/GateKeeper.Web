<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GateKeeper!</title>


    <!-- =====================================
         SHARED CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="css/theme.css"
    >

    <link
        rel="stylesheet"
        href="css/layout.css"
    >

    <link
        rel="stylesheet"
        href="css/site.css"
    >


    <!-- =====================================
         GATEKEEPER LOGO
    ====================================== -->

    <style>

        .gatekeeper-brand {

            width: 100%;

            max-width: 1100px;

            margin: 0 auto 25px auto;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .gatekeeper-brand img {

            display: block;

            width: 100%;

            max-width: 1000px;

            height: auto;

            object-fit: contain;

        }


        @media (max-width: 600px) {

            .gatekeeper-brand {

                margin-bottom: 20px;

            }


            .gatekeeper-brand img {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header>

        <h1>
            GateKeeper!
        </h1>

        <div class="status online">
            ● Online
        </div>

    </header>



    <!-- =====================================
         MAIN
    ====================================== -->

    <main>


        <!-- =================================
             GATEKEEPER BRAND
        ================================== -->

        <section class="gatekeeper-brand">

            <img
                src="assets/logo.png"
                alt="GateKeeper - Event Access. Secure. Simple."
            >

        </section>



        <!-- =================================
             CURRENT EVENT
        ================================== -->

        <section class="event-select">

            <label for="eventSelect">
                Current Event
            </label>

            <select id="eventSelect">

                <option>
                    Loading events...
                </option>

            </select>

        </section>



        <!-- =================================
             MENU
        ================================== -->

        <section class="menu">


            <!-- =============================
                 CHECK IN
            ============================== -->

            <button
                class="menu-card"
                id="btnCheckIn"
            >

                <div class="icon">
                    📷
                </div>

                <h2>
                    Check In
                </h2>

                <p>
                    Scan tickets as guests arrive.
                </p>

            </button>



            <!-- =============================
                 CHECK OUT
            ============================== -->

            <button
                class="menu-card"
                id="btnCheckOut"
            >

                <div class="icon">
                    🚪
                </div>

                <h2>
                    Check Out
                </h2>

                <p>
                    Scan guests leaving the event.
                </p>

            </button>



            <!-- =============================
                 EVENT STATUS
            ============================== -->

            <button
                class="menu-card"
                id="btnStatus"
                onclick="window.location.href='stats.html'"
            >

                <div class="icon">
                    📊
                </div>

                <h2>
                    Event Status
                </h2>

                <p>
                    Attendance and live statistics.
                </p>

            </button>


        </section>


    </main>



    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer>

        Version 1.0.0

    </footer>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <!-- Configuration -->
    <script src="js/config.js"></script>


    <!-- Authentication -->
    <script src="js/auth.js"></script>


    <!-- =====================================
         AUTHENTICATION CHECK
    ====================================== -->

    <script>

        /*
         * Check authentication before
         * starting the GateKeeper application.
         */

        if (!checkGateKeeperAuth()) {

            /*
             * Stop this page's application
             * from being initialised.
             */

            throw new Error(
                "GateKeeper authentication required."
            );

        }

    </script>



    <!-- API -->
    <script src="js/api.js"></script>


    <!-- Main application -->
    <script src="js/app.js"></script>


</body>

</html>
