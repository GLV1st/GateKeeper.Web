<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GateKeeper!</title>


    <!-- =====================================
         SHARED CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="css/theme.css"
    >

    <link
        rel="stylesheet"
        href="css/layout.css"
    >

    <link
        rel="stylesheet"
        href="css/site.css"
    >

</head>


<body>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header>

        <h1>
            GateKeeper!
        </h1>

        <div class="status online">
            ● Online
        </div>

    </header>


    <!-- =====================================
         MAIN
    ====================================== -->

    <main>


        <!-- =================================
             CURRENT EVENT
        ================================== -->

        <section class="event-select">

            <label for="eventSelect">
                Current Event
            </label>

            <select id="eventSelect">

                <option>
                    Loading events...
                </option>

            </select>

        </section>


        <!-- =================================
             MENU
        ================================== -->

        <section class="menu">


            <!-- =============================
                 CHECK IN
            ============================== -->

            <button
                class="menu-card"
                id="btnCheckIn"
            >

                <div class="icon">
                    📷
                </div>

                <h2>
                    Check In
                </h2>

                <p>
                    Scan tickets as guests arrive.
                </p>

            </button>


            <!-- =============================
                 CHECK OUT
            ============================== -->

            <button
                class="menu-card"
                id="btnCheckOut"
            >

                <div class="icon">
                    🚪
                </div>

                <h2>
                    Check Out
                </h2>

                <p>
                    Scan guests leaving the event.
                </p>

            </button>


            <!-- =============================
                 EVENT STATUS
            ============================== -->

            <button
                class="menu-card"
                id="btnStatus"
                onclick="window.location.href='stats.html'"
            >

                <div class="icon">
                    📊
                </div>

                <h2>
                    Event Status
                </h2>

                <p>
                    Attendance and live statistics.
                </p>

            </button>


            <!-- =============================
                 SETTINGS
            ============================== -->

            <button
                class="menu-card"
                id="btnSettings"
            >

                <div class="icon">
                    ⚙
                </div>

                <h2>
                    Settings
                </h2>

                <p>
                    Application settings.
                </p>

            </button>


        </section>


    </main>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer>

        Version 1.0.0

    </footer>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/app.js"></script>


</body>

</html>
