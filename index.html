<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GateKeeper</title>

<link rel="stylesheet" href="css/site.css">

</head>

<body>

<div class="app">

    <header>

        <h1>GateKeeper!</h1>

        <div class="status online">
            ● Online
        </div>

    </header>

    <main>

        <section class="event-select">

            <label for="eventSelect">Current Event</label>

            <select id="eventSelect">
                <option>Loading events...</option>
            </select>

        </section>

        <section class="menu">

            <button class="menu-card" id="btnCheckIn">

                <div class="icon">📷</div>

                <h2>Check In</h2>

                <p>Scan tickets as guests arrive.</p>

            </button>

            <button class="menu-card" id="btnCheckOut">

                <div class="icon">🚪</div>

                <h2>Check Out</h2>

                <p>Scan guests leaving the event.</p>

            </button>

            <button class="menu-card" id="btnStatus">

                <div class="icon">📊</div>

                <h2>Event Status</h2>

                <p>Attendance and live statistics.</p>

            </button>

            <button class="menu-card" id="btnSettings">

                <div class="icon">⚙</div>

                <h2>Settings</h2>

                <p>Application settings.</p>

            </button>

        </section>

    </main>

    <footer>

        Version 1.0.0

    </footer>

</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/app.js"></script>

</body>

</html>
